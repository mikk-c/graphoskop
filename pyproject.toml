[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graphoskop"
version = "0.13.18"
description = "Analysis of networks and of vectors defined on their nodes."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numba", "numpy", "pandas", "scipy", "torch", "torch_geometric", "tqdm"]

[project.urls]
Documentation = "https://graphoskop.readthedocs.io/en/latest/"
Textbook = "https://www.networkatlas.eu/"

[project.optional-dependencies]
docs = ["sphinx", "sphinx_rtd_theme"]
gui = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["graphoskop*"]
